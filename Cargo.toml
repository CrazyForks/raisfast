[package]
name = "rust-blog"
version = "0.1.0"
edition = "2024"

[features]
default = ["db-sqlite"]

# ── Database backend (pick exactly one) ────────────────────────────
db-sqlite  = ["sqlx/sqlite"]
db-postgres = ["sqlx/postgres"]
db-mysql   = ["sqlx/mysql"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Data types
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

# Security
argon2 = "0.5"
getrandom = "0.2"
jsonwebtoken = "9"
ammonia = "4"

# Error handling
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Validation
validator = { version = "0.19", features = ["derive"] }

# URL encoding
serde_urlencoded = "0.7"

# Content
comrak = { version = "0.36", features = ["shortcodes"] }
syntect = "5"
slug = "0.1"

# Media
image = "0.25"

# RSS
rss = "2"
rust-i18n = "3.1.5"
clap = { version = "4.6.0", features = ["derive"] }
nix = { version = "0.31.2", features = ["signal"] }

# Plugin system
wasmtime = "26"
wasmtime-wasi = "26"
toml = "0.8"
notify = { version = "7", features = ["macos_kqueue"] }

[dev-dependencies]
http-body-util = "0.1.3"
rstest = "0.23"
tempfile = "3"
