[app]
name = "{{ name }}"
host = "0.0.0.0"
port = 9898
env = "development"
base_url = "http://localhost:9898"

[database]
driver = "sqlite"
name = "raisfast.db"

[jwt]
secret = "change-me-in-production"
access_expires = 3600
refresh_expires = 604800

[content_type]
dir = "./extensions/content_types"

[plugin]
dir = "./extensions/plugins"
hot_reload = true

[upload]
dir = "./public/uploads"
max_size = 10485760

[rule_engine]
cms_max_page_size = 100
cms_cache_ttl_secs = 30

[log]
dir = "./logs"
max_files = 10
level = "info"
