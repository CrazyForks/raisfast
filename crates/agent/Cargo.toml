[package]
name = "raisfast-agent"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "RaisFast AI agent core: turn loop, tools, providers (MVP)."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
thiserror = "2"
