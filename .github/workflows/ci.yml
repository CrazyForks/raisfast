name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.db }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup PostgreSQL
        if: matrix.db == 'postgres'
        run: |
          sudo apt-get install -y postgresql-client
          sudo -u postgres createuser --superuser --login postgres 2>/dev/null || true
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE raisfast_prepare" 2>/dev/null || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d raisfast_prepare -f migrations/postgres/schema.postgres.sql

      - name: Setup MySQL
        if: matrix.db == 'mysql'
        run: |
          sudo systemctl start mysql
          mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS raisfast_prepare"
          mysql -u root -proot raisfast_prepare < migrations/mysql/schema.mysql.sql

      - name: Setup SQLite
        if: matrix.db == 'sqlite'
        run: |
          mkdir -p /tmp/sqlite_prepare
          sqlite3 /tmp/sqlite_prepare/raisfast.db < migrations/sqlite/schema.sqlite.sql

      - name: Prepare sqlx cache
        env:
          DATABASE_URL: ${{ matrix.db == 'sqlite' && 'sqlite:/tmp/sqlite_prepare/raisfast.db' || matrix.db == 'postgres' && 'postgres://postgres:postgres@localhost:5432/raisfast_prepare' || 'mysql://root:root@127.0.0.1:3306/raisfast_prepare' }}
        run: |
          SQLX_OFFLINE=false cargo sqlx prepare --workspace -- --tests --no-default-features --features "db-${{ matrix.db }} plugin-js plugin-rhai search-tantivy payment-all tunnel mcp cron-system"

      - name: Clippy
        env:
          SQLX_OFFLINE: true
          DATABASE_URL: ${{ matrix.db == 'sqlite' && 'sqlite:/tmp/sqlite_prepare/raisfast.db' || matrix.db == 'postgres' && 'postgres://postgres:postgres@localhost:5432/raisfast_prepare' || 'mysql://root:root@127.0.0.1:3306/raisfast_prepare' }}
        run: cargo clippy -p raisfast --tests --no-default-features --features "db-${{ matrix.db }} plugin-js plugin-rhai search-tantivy payment-all tunnel mcp cron-system" -- -D warnings

  test:
    name: Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            features: "db-sqlite plugin-js plugin-rhai search-tantivy payment-all tunnel mcp cron-system"
            test_threads: ""
          - db: postgres
            features: "db-postgres plugin-js plugin-rhai search-tantivy payment-all tunnel mcp cron-system"
            test_threads: "-- --test-threads=1"
          - db: mysql
            features: "db-mysql plugin-js plugin-rhai search-tantivy payment-all tunnel mcp cron-system"
            test_threads: "-- --test-threads=1"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.db }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup PostgreSQL
        if: matrix.db == 'postgres'
        run: |
          sudo apt-get install -y postgresql-client
          sudo -u postgres createuser --superuser --login postgres 2>/dev/null || true
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE raisfast_test"
          PGPASSWORD=postgres psql -h localhost -U postgres -d raisfast_test -f migrations/postgres/schema.postgres.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE raisfast_prepare"
          PGPASSWORD=postgres psql -h localhost -U postgres -d raisfast_prepare -f migrations/postgres/schema.postgres.sql

      - name: Setup MySQL
        if: matrix.db == 'mysql'
        run: |
          sudo systemctl start mysql
          mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS raisfast_test"
          mysql -u root -proot raisfast_test < migrations/mysql/schema.mysql.sql
          mysql -u root -proot -e "CREATE DATABASE IF NOT EXISTS raisfast_prepare"
          mysql -u root -proot raisfast_prepare < migrations/mysql/schema.mysql.sql

      - name: Setup SQLite
        if: matrix.db == 'sqlite'
        run: sqlite3 /tmp/sqlite_prepare.db < migrations/sqlite/schema.sqlite.sql

      - name: Prepare sqlx cache
        env:
          DATABASE_URL: ${{ matrix.db == 'sqlite' && 'sqlite:/tmp/sqlite_prepare.db' || matrix.db == 'postgres' && 'postgres://postgres:postgres@localhost:5432/raisfast_prepare' || 'mysql://root:root@127.0.0.1:3306/raisfast_prepare' }}
        run: |
          SQLX_OFFLINE=false cargo sqlx prepare --workspace -- --tests --no-default-features --features "db-${{ matrix.db }} plugin-js plugin-rhai search-tantivy payment-all tunnel mcp cron-system"

      - name: Run tests
        env:
          SQLX_OFFLINE: true
          DATABASE_URL: ${{ matrix.db == 'sqlite' && 'sqlite::memory:' || matrix.db == 'postgres' && 'postgres://postgres:postgres@localhost:5432/raisfast_test' || 'mysql://root:root@127.0.0.1:3306/raisfast_test' }}
          RAISFAST_TEST_DB_URL: ${{ matrix.db == 'sqlite' && 'sqlite::memory:' || matrix.db == 'postgres' && 'postgres://postgres:postgres@localhost:5432/raisfast_test' || 'mysql://root:root@127.0.0.1:3306/raisfast_test' }}
        run: cargo test -p raisfast --no-default-features --features "${{ matrix.features }}" ${{ matrix.test_threads }}

