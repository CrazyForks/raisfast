name: Docker

# Builds and pushes Docker image right after release.yml (cargo-dist) uploads
# the SQLite binary to GitHub Release. Does NOT depend on build-all.yml.
#
# Flow:
#   tag push → release.yml builds SQLite binary → uploads to Release
#            → this workflow polls Release until binary appears → builds image

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.8)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for SQLite binary in GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          TAG="${{ steps.tag.outputs.tag }}"
          # release.yml (cargo-dist) uploads the SQLite binary.
          # Poll until it appears (up to 30 min).
          for i in $(seq 1 60); do
            if gh release download "$TAG" \
              --pattern "raisfast-x86_64-unknown-linux-musl.tar.xz" \
              --dir dist 2>/dev/null; then
              echo "Downloaded SQLite binary on attempt $i"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Timed out waiting for release artifacts"
              exit 1
            fi
            echo "Waiting for release artifacts... ($i/60)"
            sleep 30
          done
          tar -xf dist/raisfast-x86_64-unknown-linux-musl.tar.xz -C dist/
          cp dist/raisfast-x86_64-unknown-linux-musl/raisfast dist/binary

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
