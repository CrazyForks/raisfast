[content_type]
name = "Forum Vote"
singular = "vote"
plural = "votes"
table = "forum_votes"
group = "forum"
description = "Forum vote records"
implements = ["ownable", "timestampable"]

[fields.target_type]
type = "text"
required = true
max_length = 10
immutable = true
label = "Target Type"

[fields.target_id]
type = "text"
required = true
immutable = true
label = "Target ID"

[fields.user_id]
type = "text"
required = true
immutable = true
label = "Voter"

[fields.value]
type = "integer"
required = true
min = -1
max = 1
default = 1
label = "Vote Value"

[[indexes]]
fields = ["target_type", "target_id", "user_id"]
unique = true

[[indexes]]
fields = ["target_id", "created_at"]

[api.list]
access = "admin"
cache = true

[api.get]
access = "admin"
cache = true

[api.create]
access = "admin"

[api.update]
access = "admin"

[api.delete]
access = "admin"
