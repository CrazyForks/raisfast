[content_type]
name = "Product Category"
singular = "product_category"
plural = "product_categories"
table = "product_categories"
description = "商品分类"
implements = ["ownable", "timestampable"]
slug_field = "name"

[fields.name]
type = "text"
required = true
max_length = 100
label = "分类名称"

[fields.slug]
type = "uid"
target_field = "name"
unique = true
label = "URL 标识"

[fields.description]
type = "text"
max_length = 500
label = "描述"

[fields.parent]
type = "relation"
relation_type = "many_to_one"
target = "product_categories"
foreign_key = "parent_id"
label = "父分类"

[fields.sort_order]
type = "integer"
default = 0
label = "排序"

[fields.image]
type = "media"
accept = ["image/*"]
max_count = 1
label = "分类图片"

[[indexes]]
fields = ["slug"]
unique = true

[list_view]
default_sort = "sort_order:asc,created_at:desc"
columns = ["name", "slug", "sort_order", "created_at"]

[api.list]
access = "public"
cache = true

[api.get]
access = "public"
cache = true

[api.create]
access = "admin"

[api.update]
access = "admin"

[api.delete]
access = "admin"
