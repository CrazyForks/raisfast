[content_type]
name = "Forum Poll Vote"
singular = "forum_poll_vote"
plural = "forum_poll_votes"
table = "forum_poll_votes"
description = "投票记录"
implements = ["ownable", "timestampable"]

[fields.poll]
type = "relation"
relation_type = "many_to_one"
target = "forum_polls"
foreign_key = "poll_id"
required = true
immutable = true
label = "所属投票"

[fields.option]
type = "relation"
relation_type = "many_to_one"
target = "forum_poll_options"
foreign_key = "option_id"
required = true
immutable = true
label = "所选选项"

[fields.user_id]
type = "text"
required = true
immutable = true
label = "投票用户"

[[indexes]]
fields = ["option_id", "user_id"]
unique = true

[[indexes]]
fields = ["poll_id", "user_id"]

[list_view]
default_sort = "created_at:desc"
columns = ["poll", "option", "user_id", "created_at"]

[api.list]
access = "admin"
cache = true

[api.get]
access = "admin"
cache = true

[api.create]
access = "admin"

[api.update]
access = "admin"

[api.delete]
access = "admin"
