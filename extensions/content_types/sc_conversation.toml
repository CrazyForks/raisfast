[content_type]
name = "Conversation"
singular = "sc_conversation"
plural = "sc_conversations"
table = "sc_conversations"
implements = [
    "ownable",
    "timestampable",
]

[fields.contact_id]
type = "bigint"

[fields.status]
type = "text"

[api.list]
access = "authed"
cache = false

[api.get]
access = "authed"
cache = false

[api.create]
access = "authed"
cache = false

[api.update]
access = "owner"
cache = false

[api.delete]
access = "admin"
cache = false
