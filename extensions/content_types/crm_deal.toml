[content_type]
name = "Deal"
singular = "deal"
plural = "deals"
table = "crm_deals"
description = "商机/销售机会"
implements = ["ownable", "timestampable"]

[fields.title]
type = "text"
required = true
max_length = 300
label = "商机名称"

[fields.amount]
type = "decimal"
min = 0
default = 0
label = "金额"

[fields.currency]
type = "enum"
enum_values = ["CNY", "USD", "EUR", "GBP", "JPY"]
default = "CNY"
label = "币种"

[fields.stage]
type = "enum"
enum_values = ["prospecting", "qualification", "proposal", "negotiation", "closed_won", "closed_lost"]
default = "prospecting"
label = "阶段"

[fields.probability]
type = "integer"
min = 0
max = 100
default = 10
label = "赢单概率(%)"

[fields.contact]
type = "relation"
relation_type = "many_to_one"
target = "contacts"
foreign_key = "contact_id"
label = "关联联系人"

[fields.company]
type = "relation"
relation_type = "many_to_one"
target = "companies"
foreign_key = "company_id"
label = "关联公司"

[fields.owner_id]
type = "text"
label = "负责人"

[fields.close_date]
type = "date"
label = "预计成交日期"

[fields.description]
type = "richtext"
label = "描述"

[fields.loss_reason]
type = "enum"
enum_values = ["no_budget", "no_decision", "lost_to_competitor", "timing", "lack_of_fit", "other"]
label = "丢单原因"

[[indexes]]
fields = ["stage"]

[[indexes]]
fields = ["owner_id", "created_at"]

[[indexes]]
fields = ["company_id"]

[[indexes]]
fields = ["contact_id"]

[[indexes]]
fields = ["close_date"]

[list_view]
default_sort = "created_at:desc"
columns = ["title", "amount", "stage", "probability", "company", "contact", "owner_id", "close_date"]

[api.list]
access = "member"

[api.get]
access = "member"

[api.create]
access = "member"

[api.update]
access = "member"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"

[api.delete]
access = "admin"
