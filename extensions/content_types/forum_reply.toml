[content_type]
name = "Forum Reply"
singular = "reply"
plural = "replies"
table = "forum_replies"
group = "forum"
description = "Forum replies"
implements = ["ownable", "timestampable"]

[fields.content]
type = "richtext"
required = true
label = "Content"

[fields.topic]
type = "relation"
relation_type = "many_to_one"
target = "forum_topics"
foreign_key = "topic_id"
required = true
immutable = true
label = "Topic"

[fields.author_id]
type = "text"
required = true
immutable = true
label = "Author"

[fields.parent_reply]
type = "relation"
relation_type = "many_to_one"
target = "forum_replies"
foreign_key = "parent_reply_id"
immutable = true
label = "Parent Reply"

[fields.is_answer]
type = "boolean"
default = false
label = "Accepted Answer"

[fields.vote_count]
type = "integer"
default = 0
private = true
label = "Vote Count"

[[indexes]]
fields = ["topic_id", "created_at"]

[[indexes]]
fields = ["author_id", "created_at"]

[api.list]
access = "public"
cache = true

[api.get]
access = "public"
cache = true

[api.create]
access = "authed"

[api.update]
access = "authed"
filter = "@request.auth.id == author_id || @request.auth.role == 'admin'"

[api.delete]
access = "authed"
filter = "@request.auth.id == author_id || @request.auth.role == 'admin'"
