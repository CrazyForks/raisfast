[content_type]
name = "Note"
singular = "note"
plural = "notes"
table = "crm_notes"
group = "crm"
description = "Notes and follow-up records"
implements = ["ownable", "timestampable"]

[fields.content]
type = "richtext"
required = true
label = "Content"

[fields.contact]
type = "relation"
relation_type = "many_to_one"
target = "crm_contacts"
foreign_key = "contact_id"
label = "Related Contact"

[fields.company]
type = "relation"
relation_type = "many_to_one"
target = "crm_companies"
foreign_key = "company_id"
label = "Related Company"

[fields.deal]
type = "relation"
relation_type = "many_to_one"
target = "crm_deals"
foreign_key = "deal_id"
label = "Related Deal"

[fields.owner_id]
type = "text"
label = "Creator"

[fields.pinned]
type = "boolean"
default = false
label = "Pinned"

[[indexes]]
fields = ["contact_id", "created_at"]

[[indexes]]
fields = ["company_id", "created_at"]

[[indexes]]
fields = ["deal_id", "created_at"]

[[indexes]]
fields = ["owner_id", "created_at"]

[api.list]
access = "authed"

[api.get]
access = "authed"

[api.create]
access = "authed"

[api.update]
access = "authed"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"

[api.delete]
access = "authed"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"
