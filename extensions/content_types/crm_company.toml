[content_type]
name = "Company"
singular = "company"
plural = "companies"
table = "crm_companies"
description = "公司/组织"
implements = ["ownable", "timestampable"]

[fields.name]
type = "text"
required = true
max_length = 200
label = "公司名称"

[fields.website]
type = "text"
label = "网站"

[fields.industry]
type = "enum"
enum_values = ["technology", "finance", "healthcare", "education", "retail", "manufacturing", "real_estate", "consulting", "media", "other"]
default = "other"
label = "行业"

[fields.size]
type = "enum"
enum_values = ["1-10", "11-50", "51-200", "201-500", "501-1000", "1000+"]
default = "1-10"
label = "公司规模"

[fields.phone]
type = "text"
label = "电话"

[fields.address]
type = "text"
label = "地址"

[fields.city]
type = "text"
label = "城市"

[fields.country]
type = "text"
default = "CN"
label = "国家"

[fields.description]
type = "richtext"
label = "公司简介"

[fields.owner_id]
type = "text"
label = "负责人"

[[indexes]]
fields = ["name"]

[[indexes]]
fields = ["industry"]

[[indexes]]
fields = ["owner_id", "created_at"]

[list_view]
default_sort = "created_at:desc"
columns = ["name", "industry", "size", "city", "owner_id", "created_at"]

[api.list]
access = "member"

[api.get]
access = "member"

[api.create]
access = "member"

[api.update]
access = "member"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"

[api.delete]
access = "admin"
