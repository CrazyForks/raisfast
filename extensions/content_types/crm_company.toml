[content_type]
name = "Company"
singular = "company"
plural = "companies"
table = "crm_companies"
group = "crm"
description = "Companies and organizations"
implements = ["ownable", "timestampable"]

[fields.name]
type = "text"
required = true
max_length = 200
label = "Company Name"

[fields.website]
type = "text"
label = "Website"

[fields.industry]
type = "enum"
enum_values = ["technology", "finance", "healthcare", "education", "retail", "manufacturing", "real_estate", "consulting", "media", "other"]
default = "other"
label = "Industry"

[fields.size]
type = "enum"
enum_values = ["1-10", "11-50", "51-200", "201-500", "501-1000", "1000+"]
default = "1-10"
label = "Company Size"

[fields.phone]
type = "text"
label = "Phone"

[fields.address]
type = "text"
label = "Address"

[fields.city]
type = "text"
label = "City"

[fields.country]
type = "text"
default = "CN"
label = "Country"

[fields.description]
type = "richtext"
label = "Description"

[fields.owner_id]
type = "text"
label = "Owner"

[[indexes]]
fields = ["name"]

[[indexes]]
fields = ["industry"]

[[indexes]]
fields = ["owner_id", "created_at"]

[api.list]
access = "authed"

[api.get]
access = "authed"

[api.create]
access = "authed"

[api.update]
access = "authed"
filter = "@request.auth.id == owner_id || @request.auth.role == 'admin'"

[api.delete]
access = "admin"
