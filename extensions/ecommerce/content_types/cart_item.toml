[content_type]
name = "Cart Item"
singular = "cart_item"
plural = "cart_items"
table = "cart_items"
description = "购物车项"
draft_publish = false
timestamps = true
soft_delete = false

[fields.user_id]
type = "text"
required = true
label = "用户ID"

[fields.product_id]
type = "text"
required = true
label = "商品ID"

[fields.quantity]
type = "integer"
required = true
min = 1
default = 1
label = "数量"

[[indexes]]
fields = ["user_id", "product_id"]
unique = true

[list_view]
default_sort = "created_at:desc"
columns = ["user_id", "product_id", "quantity", "created_at"]

[api.list]
access = "admin"

[api.get]
access = "admin"

[api.create]
access = "admin"

[api.update]
access = "admin"

[api.delete]
access = "admin"
