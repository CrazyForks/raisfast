[plugin]
id = "com.rust-blog.content-filter"
name = "Content Filter"
version = "1.0.0"
description = "过滤评论中的敏感词"
author = "rust-blog"
license = "MIT"
runtime = "wasm"
language = "rust"

[permissions]
http = []
config = []
max_memory_mb = 8
timeout_ms = 2000

[hooks.on_comment_creating]
priority = 5
