[plugin]
id = "com.rust-blog.seo-optimizer"
name = "SEO Optimizer"
version = "1.0.0"
description = "自动优化文章 SEO：生成 meta description、OG 标签"
author = "rust-blog"
license = "MIT"
runtime = "wasm"
language = "rust"

[permissions]
http = []
config = []
max_memory_mb = 16
timeout_ms = 3000

[hooks.on_post_creating]
priority = 10

[hooks.filter_html]
priority = 5
